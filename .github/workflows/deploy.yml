# Tests, builds and publishes the game to GitHub Pages on every push to main.
# Live at https://johnchampaign.github.io/rink-rumble/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Stamp the build with the commit (shown on the title screen) and give the script a new
      # address on every deploy, so phones and tablets can't keep running a cached old copy.
      - run: npm run build -- --define:BUILD_ID="\"${GITHUB_SHA::7}\""

      - name: Assemble site
        run: |
          mkdir -p _site/build
          cp web/build/main.js _site/build/main.js
          sed "s|src=\"build/main.js\"|src=\"build/main.js?v=${GITHUB_SHA::7}\"|" web/index.html > _site/index.html
          grep -q "main.js?v=${GITHUB_SHA::7}" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
